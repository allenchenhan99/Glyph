name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install backend and quality tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e "backend[dev]"
      - name: Lint
        run: python -m ruff check backend/src backend/tests
      - name: Check formatting
        run: python -m ruff format --check backend/src backend/tests
      - name: Type check
        run: python -m mypy backend/src/glyph
      - name: Test with coverage
        run: python -m pytest --cov=glyph --cov-report=term-missing --cov-fail-under=85
      - name: Static security scan
        run: python -m bandit -q -r backend/src/glyph
      - name: Audit Python dependencies
        run: python -m pip_audit

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build production assets
        run: npm run build
