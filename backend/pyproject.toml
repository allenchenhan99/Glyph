[project]
name = "glyph-backend"
version = "0.1.0"
description = "Local document parsing and Traditional Chinese translation backend for Glyph"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
glyph-contract = "glyph.contract_cli:entrypoint"

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8",
    "httpx2>=2.10",
    "mypy>=1.14",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "FURB", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/glyph/documents.py" = ["B008"]
"src/glyph/contract_routes.py" = ["B008"]
"src/glyph/research_routes.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["glyph"]

[tool.coverage.report]
show_missing = true
